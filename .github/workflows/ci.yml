name: CI - Lint, Test & Mock Benchmark

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit & Integration Test Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint Codebase
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Test Suite
        run: |
          pytest -v tests/ --cov=benchmark_engine --cov-report=term-missing

      - name: Execute Mock Red-Team Benchmark Run
        run: |
          python -m cli.main --mock --iterations 5 --output-dir ./reports

      - name: Upload Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports-py${{ matrix.python-version }}
          path: reports/
